apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "status-page.fullname" . }}
  labels:
    {{- include "status-page.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.strona.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "status-page.fullname" . }}-strona
                port:
                  name: http
    - host: {{ .Values.status.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "status-page.fullname" . }}-status
                port:
                  name: http
