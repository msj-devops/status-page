{{- if not .Values.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "status-page.pvc" . }}
  labels:
    {{- include "status-page.labels" . | nindent 4 }}
    app.kubernetes.io/component: dane
  annotations:
    # helm uninstall zostawia PVC (i raporty) w klastrze; usuwasz go świadomie, ręcznie
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
